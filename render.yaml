services:
  - type: web
    name: liveroums-anticheat
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN          # jeton d'accès au tableau de bord (≥ 16 caractères), à saisir dans Render
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_FRAME_ANCESTORS  # origines autorisées à intégrer le tableau de bord (iframe /admin/anti-triche du site)
        value: "'self' https://liveroums-arena.onrender.com"
      - key: SITE_URL
        value: https://liveroums-arena.onrender.com
      - key: SITE_EXPORT_TOKEN    # = ANTICHEAT_EXPORT_TOKEN du site ; active la synchro automatique (source principale)
        sync: false
      - key: EXPORT_INTERVAL_S    # intervalle de synchro de l'export (min 60 ; le site limite à 6 req/min)
        value: "300"
      - key: COLLECT_ENABLED
        value: "1"
      - key: COLLECT_RPM          # requêtes/min vers le site (max 100, limite du site : 120/min/IP)
        value: "40"
      - key: COLLECT_INTERVAL_S
        value: "180"
      - key: ALERT_THRESHOLD
        value: "50"
      - key: DISCORD_WEBHOOK_URL  # optionnel
        sync: false
      - key: SMTP_URL             # optionnel (email désactivé si vide)
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: LLM_API_KEY          # optionnel : résumé IA désactivé si vide
        sync: false
      - key: LLM_API_URL
        sync: false
      - key: LLM_MODEL
        sync: false
